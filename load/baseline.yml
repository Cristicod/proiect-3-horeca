config:
  target: "http://localhost:3000"
  phases:
    - duration: 10
      arrivalRate: 10
      name: "Ramp up to 10 VUs"
    - duration: 20
      arrivalRate: 50
      name: "Ramp up to 50 VUs"
    - duration: 30
      arrivalRate: 100
      name: "Peak load 100 VUs"
scenarios:
  - name: "Static Baseline QR Order Flow"
    flow:
      - post:
          url: "/baseline/orders"
          json:
            tableNumber: 1
            clientRequestId: "artillery_base_{{ $randomNumber(1000, 999999) }}"
            items:
              - menuItemId: "{{ menuItemId }}"
                quantity: 1

